name: FyreDisguise
main: dev.fyre.disguise.FyreDisguisePlugin
version: 0.1.0
description: Experimental developer-facing disguise framework
author: Fyre
depend: [ProtocolLib]
commands:
  fyredisguise:
    description: Administration and testing of global disguise state
    usage: /fyredisguise <set|clear|status|reset|stats|inspect|restore>
    permission: fyredisguise.admin
permissions:
  fyredisguise.admin:
    description: Allows editing and viewing test aliases
    default: op
