name: Disguise
main: gg.rl1.disguise.DisguisePlugin
version: 0.1.0
description: Experimental developer-facing disguise framework
author: 1rl
depend: [ProtocolLib]
commands:
  disguise:
    description: Administration and testing of global disguise state
    usage: /disguise <set|clear|status|reset|stats|inspect|restore>
    permission: disguise.admin
permissions:
  disguise.admin:
    description: Allows editing and viewing test aliases
    default: op
