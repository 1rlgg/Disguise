name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify Java 8 compatibility and unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload verified development artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fyredisguise-development-jar
          path: target/fyredisguise-*.jar
          if-no-files-found: error
