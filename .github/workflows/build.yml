name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Java 8 source compatibility and unit tests
        run: |
          java -version
          mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload verified development artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: disguise-development-jar
          path: target/disguise-*.jar
          if-no-files-found: error
